# 集成测试用文件路径占位（IetmAttachmentServiceImpl等依赖，测试不实际读写）
accessFile:
  resourceHandler: /showStaticDir/**
  location: ${java.io.tmpdir}/ietm-test/file
  decryptLocation: ${java.io.tmpdir}/ietm-test/file/decrypt
  icnLocation: ${java.io.tmpdir}/ietm-test/file/icn


jeecg:
  safeMode: false
  signatureSecret: dd05f1c54d63749eda95f9fa6d49v442a
  uploadType: local
  path:
    upload: ${accessFile.location}
    webapp: ${accessFile.location}/webapp
  # ES关闭健康检查，避免测试环境无ES导致启动失败
